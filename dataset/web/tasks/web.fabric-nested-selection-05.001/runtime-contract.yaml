schema_version: 1
visibility: evaluator_owned
service:
  command: node env/service.mjs --host 127.0.0.1 --port "{service_port}"
  health_path: /health
application:
  command: node build.mjs && CUA_SWE_EXTERNAL_SERVICE_ORIGIN=http://127.0.0.1:{service_port} node server.mjs
    --host 127.0.0.1 --port {app_port}
  start_url: http://127.0.0.1:{app_port}
agent_policy:
  service_source_visible: false
  direct_loopback_http_allowed: false
  process_environment_inspection_allowed: false
browser_observation:
  steps:
  - In Nested A, observe the unselected native scene and click actual Blue fill.
  - Acquire the visible side at initial-axis midpoint (-30,0) with the inherited off-center grab; translate
    by (96,0) and release.
  - Reacquire the visible corner (66,-18), independent of native control key; move by (12,66) to (78,48)
    and release.
  - Move the resulting shape by inner-parent (-3,-2) using ordinary visible fill input.
  - In Single C preserve width-minus-20, a small 10-degree rotation and fill movement (2,-2).
  decisive_edge: Evaluator-owned replay endpoints construct explicit expected polygons, projected through
    the protected feed camera and declared fixture frames. Nondegenerate side checkpoints are at one-sixth
    and full displacement; corner checkpoints are at one-twelfth and full displacement, never collapse.
    Acquire actual unordered pixel markers by geometric location and visibly supported off-center positions,
    and actual Blue fill. Verify paint, silhouette, outline, controls, frames, Amber, selection and unchanged
    camera readouts during held previews and after release. No candidate arrays, private transforms, getCoords/oCoords,
    telemetry or application object access supplies oracle truth.
  exclusions: No scored cancellation, held Escape, focus, modifiers, exact-zero stop, persistence, shared-size,
    reparenting or expanded camera matrix. Do not grade private flip flags, angle/scale normalization,
    native control keys or rotation stem side after reflection. Equivalent geometry and usable visible
    controls are valid; the solid fill has no asymmetric material identity. Unsupported markers/readouts
    or insufficient visible regions are coverage issues, not implementation-choice failures. No fixed
    rotation-stem length assumption.
  result_contract: native-results.json, raw screenshots, annotated copies, input logs, assertions, coverage
    gaps and runtime errors go to CUA_SWE_VERIFIER_ARTIFACTS, with a writable /tmp fallback. Exit 0 is
    a complete covered pass, 1 a reached public behavior failure, and 2 unsupported coverage/setup/runtime
    requiring causal review. Dependent input stops after decisive divergence or unsupported acquisition.
    Cleanup releases after a stopped preview retain unscored raw images. Missing continuation is not additional
    negative evidence. Complete-alternative raw success is preserved as passed/raw_success, independently
    of legacy control_passed.
