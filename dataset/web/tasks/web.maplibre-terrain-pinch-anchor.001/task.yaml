id: web.maplibre-terrain-pinch-anchor.001
track: web_frontend
type: interaction_state
difficulty: l4
repo_snapshot:
  source: local
  path: dataset/web/tasks/web.maplibre-terrain-pinch-anchor.001/repo
  ref: 871bb784-reverse-production-fix
instruction: >-
  In the terrain gesture fixture, moving and widening a two-finger gesture on
  the pitched map makes the geographic point that was initially between the
  fingers drift away from the moving midpoint. Keep that grabbed geographic
  point attached to the gesture midpoint while zooming and panning together.
  Preserve ordinary flat-map drag and zoom behavior, rotation controls, and
  terrain elevation handling.
setup:
  install:
    - npm ci
    - npm run build-dev
  launch:
    - npx st --no-cache -H 127.0.0.1 --port 4173 .
  reset: []
environment:
  adapter: playwright_web
  start_url: http://127.0.0.1:4173/runtime-task/index.html
  viewport_or_device: desktop-1000x800
allowed_tools:
  code_edit: true
  terminal: true
  browser_gui: true
  mobile_gui: false
budgets:
  wall_time_sec: 2400
  max_steps: 180
  max_gui_actions: 220
  max_test_runs: 24
verifiers:
  build:
    - npm run build-dev
  unit: []
  ui:
    - node verifiers/check_terrain_anchor.mjs
  visual: []
  state: []
  side_effects: []
artifacts:
  collect_patch: true
  collect_logs: true
  collect_screenshots: true
  collect_trajectory: true
  collect_state_diff: false
