  source_pull_request: https://github.com/fabricjs/fabric.js/pull/10977
  source_issue: https://github.com/fabricjs/fabric.js/issues/10976
  broken_revision: fd50b70d365533e79ce421f64947fdc692cec619
  merge_commit: d87aa66d68e0b8aeafa5afa1145b919b382813e8
  fixed_head: f36e679c3b27ac434de83353f3ab52ebaef521e9
  license: MIT
  implementation: real-upstream-browser-build
  conversion_note: Historical source/license metadata retained from local records
    without retrieval. Immediate seed is the exact broken Canvas01 revision02 input;
    this variant changes only the selected existing camera or workflow order in the
    evaluator, and task relocation/lineage/replay metadata. The entire public application
    is unchanged.
