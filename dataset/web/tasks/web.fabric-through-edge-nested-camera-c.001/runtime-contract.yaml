schema_version: 1
visibility: evaluator_owned
service:
  command: node env/service.mjs --host 127.0.0.1 --port "{service_port}"
  health_path: /health
application:
  command: node build.mjs && CUA_SWE_EXTERNAL_SERVICE_ORIGIN=http://127.0.0.1:{service_port}
    node server.mjs --host 127.0.0.1 --port {app_port}
  start_url: http://127.0.0.1:{app_port}
agent_policy:
  service_source_visible: false
  direct_loopback_http_allowed: false
  process_environment_inspection_allowed: false
browser_observation:
  steps:
  - In Nested C, observe the unselected native scene and click actual Blue fill.
  - Acquire the visible side at initial-axis midpoint (-30,0) with a small supported
    off-center grab; translate its pointer by (96,0) in those initial axes and release.
  - Reacquire the visible corner at initial-axis (66,-18), irrespective of its native
    control key; move it by (12,66) and release.
  - Move the resulting shape by inner-parent (-3,-2) using ordinary visible fill input.
  - In Single C, preserve an ordinary width-minus-20 edit, small 10-degree rotation
    and fill movement (2,-2).
  decisive_edge: Public fixed/moving endpoints construct explicit expected polygons,
    projected through the protected feed camera and declared fixture frames. Nondegenerate
    side checkpoints are at one-sixth and full displacement; corner checkpoints are
    at one-twelfth and full displacement, never collapse. Acquire actual unordered
    pixel markers by geometric location and visibly supported off-center positions,
    and actual Blue fill. Verify paint, silhouette, outline, controls, frames, Amber,
    selection and unchanged camera readouts during held previews and after release.
    No candidate arrays, private transforms, getCoords/oCoords, telemetry or application
    object access supplies oracle truth.
  exclusions: No scored cancellation, held Escape, focus, modifiers, exact-zero stop,
    persistence, shared-size, reparenting or expanded camera matrix. Do not grade
    private flip flags, angle/scale normalization, native control keys or rotation
    stem side after reflection. Equivalent geometry and usable visible controls are
    valid; the solid fill has no asymmetric material identity. Unsupported markers/readouts
    or insufficient visible regions are coverage issues, not implementation-choice
    failures. No fixed rotation-stem length assumption.
  result_contract: native-results.json, raw screenshots, annotated copies, input logs,
    assertions, coverage gaps and runtime errors go to CUA_SWE_VERIFIER_ARTIFACTS,
    with a writable /tmp fallback. Exit 0 is a complete covered pass, 1 a reached
    public behavior failure, and 2 unsupported coverage/setup/runtime requiring causal
    review. Dependent input stops after decisive divergence or unsupported acquisition.
    Cleanup releases after a stopped preview retain unscored raw images. Missing continuation
    is not additional negative evidence. Complete-alternative raw success is preserved
    as passed/raw_success, independently of legacy control_passed.
validity_repair:
  version: canvas-followup-canvas-02-01
  canonical_id: web.fabric-through-edge-opposite-resize.001
  baseline: Direct exact broken Canvas01 revision02 input 4f81ef86e7206609eec7048da14391ba574ba144261f2e8915c1fef9f9e46e00.
    Application, fixture, public Help, vendor, runtime service and all reference/negative
    patches are byte-identical. No agent repair, new source fault or helper is installed.
  fixture: 'Existing synthetic native FixedLayout Group fixture, unchanged: outer
    center (200,150), size180x120, angle25, scales(1.2,.8); inner center(0,0), size120x80,
    angle-20; Blue center(0,0), size60x36, angle15; Amber outer-local center(60,0),
    size16x16. Native targeting and the Single mounting remain unchanged.'
  preserved: Full camera/parent inverse, parent-relative geometry, affine paint/control
    projection, native body movement/cache propagation, selection, ordinary non-crossing
    resize and local-frame rotation, transaction lifecycle, protected service/feed,
    vendor, build/server/package/lock bytes, original setup, policies, 1800/80/120/20
    budgets and verifier command.
  incomplete_paths: Positive-size clamps naturally do not implement the new crossing
    contract. A complete integration needs signed extents, stable fixed anchors and
    grab offsets, native scale/flip normalization, reflected starting directions for
    later visible acquisition, and idempotent release. The parent/camera inverse already
    works and is not an injected regression or missing repair here.
  reference: Gold uses signed spans in a reflected snapshot basis with absolute native
    reflection and positive scale magnitudes. The distinct alternative constructs
    transforms from fixed/moving material endpoints in a snapshot dual basis and uses
    native affine application/decomposition. Both are patch-only repairs. Two partials
    respectively omit signed anchor placement and reflected starting axes. Their predicted
    failures are visible geometry, not private parity.
  attribution: Small synthetic workflow/state variation of the qualified local Canvas01
    task. Camera C instead of Camera B for the unchanged Nested sequence. Parent qualification
    is lineage evidence only; no native validity or model result is transferred to
    this new input.
  validation: Revision01 gold reached correct aligned geometry but its early corner
    image had only two eligible edge samples on each short side. Revision02 retains
    the four-sample threshold and moves that one existing preview earlier on the same
    six-move trajectory. No native outcome is transferred.
