<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notebook</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f5;
        color: #212121;
      }
      header {
        padding: 8px 16px;
        background: #fff;
        border-bottom: 1px solid #ddd;
        font-weight: 600;
      }
      #notebook {
        max-width: 820px;
        margin: 16px auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .jp-Cell {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-left: 4px solid transparent;
        border-radius: 3px;
        padding: 4px 8px;
      }
      .jp-Cell.jp-mod-selected {
        border-left-color: #2196f3;
        background: #e8f2fd;
      }
      .jp-Cell.jp-mod-active {
        border-left-color: #1565c0;
      }
      .jp-InputArea {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .jp-InputArea-prompt {
        flex: 0 0 64px;
        color: #999;
        font-family: monospace;
        user-select: none;
        text-align: right;
        padding-top: 4px;
      }
      .jp-InputArea-editor {
        flex: 1;
        font-family: monospace;
        white-space: pre-wrap;
        background: #fafafa;
        border: 1px solid #eee;
        border-radius: 2px;
        padding: 4px 6px;
        min-height: 1.2em;
        outline: none;
      }
      .jp-RenderedMarkdown {
        flex: 1;
        padding: 2px 6px;
      }
      .jp-OutputArea {
        margin: 6px 0 2px 72px;
        font-family: monospace;
        white-space: pre-wrap;
        color: #333;
      }
    </style>
  </head>
  <body>
    <header>Notebook</header>
    <div id="notebook"></div>
    <script type="module" src="/dist/app.bundle.js"></script>
  </body>
</html>
