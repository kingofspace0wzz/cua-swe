<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Appointment booking</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: #f3f4f6; margin: 0; padding: 40px; color: #111827; }
  .card { background: #fff; max-width: 420px; margin: 0 auto; padding: 28px 32px;
          border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { color: #6b7280; margin: 0 0 20px; font-size: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: #374151; }
  .field input { font-size: 16px; padding: 10px 12px; border: 1px solid #d1d5db;
                 border-radius: 8px; font-variant-numeric: tabular-nums; }
  .field input:focus { outline: 2px solid #2563eb; border-color: #2563eb; }
  .summary { margin-top: 22px; display: flex; gap: 8px; font-size: 15px; }
  .summary-label { color: #6b7280; }
  .summary-value { font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>
<script src="./dist/app.bundle.js"></script>
</body>
</html>
