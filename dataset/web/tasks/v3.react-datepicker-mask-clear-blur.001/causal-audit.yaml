  outcome: verifier_fail
  protected_payloads_passed: 4
  protected_payloads_total: 5
  duration_sec: 96.281
  failed_payload: invalid_date_digits
  substantive_diagnosis: >-
    The code-only patch tracked a cleared flag at CHANGE time and, in the empty
    branch, eagerly committed onChange(null) immediately plus set clearedRef,
    then skipped resetInputValue on blur whenever clearedRef was set. Because the
    protected verifier emulates "select-all + delete" (which fires the empty
    change branch) BEFORE typing a value, the eager change-time onChange(null)
    dropped the previously selected date, so the subsequent invalid-date
    (13/40/2024) case could no longer restore the prior selection. Result:
    invalid_date_digits observed input='' readout='None' instead of the required
    12/25/2024. The failure is a genuine lifecycle-timing error: the clear was
    committed at the wrong moment (on change, unconditionally) instead of being
    deferred to blur and gated on the FINAL input state.

cua_trial:
  shard: v3-b53-rdp001-cua-gpt56-machine-01
  model_id: gpt-5.6-luna
  observation_mode: visual
  valid: true
  scorable: true
  protocol_clean: true
  infrastructure_error: false
  hidden_material_attempts: []
  unauthorized_external_connections: []
  verifier_sha256: 2db8c04c78b2686e07bc91840002d7d0803f8bd07db1fb27b8181c009e75a8c4
  outcome: verifier_pass
  protected_payloads_passed: 5
  protected_payloads_total: 5
  duration_sec: 195.989
  host_audited_gui_actions: 13
  host_audited_observations: 2
  matched_screenshots: 15
  budget_attestation:
    exceeded: [noncached_tokens]
    diagnostic_only: true
    frozen_harness_marks_compliant: true
  substantive_diagnosis: >-
    The CUA patch added a ref set true only in the empty-mask change branch and
    reset to false on any non-empty typed change, then on handleBlur committed
    onChange(null) (and reset the flag) BEFORE resetInputValue, but only when the
    FINAL input state was a cleared mask. This correctly distinguishes a cleared
    mask (commit clear on blur) from a merely-invalid non-empty date (the invalid
    text resets the flag, so blur preserves the prior selection). It edits only
    the agent-visible product source (src/DatePickerField.jsx); it does not touch
    the evaluator-owned env/service.mjs, env/contract.json, or verifiers/verify.py.

