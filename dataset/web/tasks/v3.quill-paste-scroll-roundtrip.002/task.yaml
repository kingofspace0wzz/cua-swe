id: v3.quill-paste-scroll-roundtrip.002
track: web_frontend
type: interaction_state
difficulty: l3
repo_snapshot:
  source: local
  path: dataset/web/tasks/v3.quill-paste-scroll-roundtrip.002/repo
  ref: quill-1374-quill-runtime-v2
instruction: "In Threadloop's shared document, applying a pending update makes the reading area jump so you lose your place, and sometimes the new paragraph is nowhere in view. Fix how the reading area settles after an update so applying it does the right thing for the update shown in the collaboration bar, including what the presence chips say about where each collaborator is currently reading. Preserve the document text, layout, presence roster, and the way updates are applied."
setup:
  install: [npm ci]
  launch: [npm run build && node server.mjs --host 127.0.0.1 --port 4188]
  reset: []
environment:
  adapter: playwright_web
  start_url: http://127.0.0.1:4188
  viewport_or_device: desktop-1280x800
allowed_tools: {code_edit: true, terminal: true, browser_gui: true, mobile_gui: false}
budgets: {wall_time_sec: 1800, max_steps: 80, max_gui_actions: 120, max_test_runs: 20}
verifiers:
  build: [npm run build]
  unit: []
  ui: [python3 verifiers/browser_check.py]
  visual: []
  state: []
  side_effects: []
artifacts: {collect_patch: true, collect_logs: true, collect_screenshots: true, collect_trajectory: true, collect_state_diff: false}
