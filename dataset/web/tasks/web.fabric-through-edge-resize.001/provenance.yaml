public_contract:
  instruction: Enable resizing Blue through opposite edges as described in Help, preserving the editor's existing behavior.
  author_task_yaml_sha256: 5fc8ee0b54576cd7f7dce67d43a2f50a82c4f5d823a0716dc1a212a281cf694b
  historical_help_sha256: fdb34b028ac87eba64d61ab1cd123cccb2792bf6f049d43a012264a1e6195243
  historical_prohibition: Keep sizes positive; do not cross or flip edges.
  history: >-
    The old positive-only contract and its passing results remain valid and
    preserved in the parent. This task explicitly adds crossing; it does not
    claim that the old task required it.
  new_help: >-
    Side/corner crossing through collapse and expansion, independently on corner
    axes; fixed opposite anchor and initial grab offset in resized directions;
    matching paint/outline/usable controls, ordinary no-jump release, subsequent
    visible resize and rigid fill continuation. Preserve selection, Amber, both
    frames, camera values, non-crossing edits, local-frame rotation and Single.
  equivalence: >-
    Geometry and usable visible controls decide success. Solid Blue cannot expose
    private parity. No preferred flip flags, normalized angle/scale, Fabric key
    or rotation-stem side is graded. The accepted source contract supersedes the
    earlier proposal's carried-stem requirement; it is not a hidden condition.
  actual_baseline_delta: >-
    Help text only in repo/index.html; task-owned browser_check.py and visible.py;
    runtime/provenance narrative and reviewer documents; four standalone patch
    artifacts. task.yaml instruction, setup, budgets1800/80/120/20, environment,
    allowed tools, artifacts and verifier command are unchanged. Runtime schema,
    visibility, service, application and agent_policy are unchanged.
integration:
  already_working: >-
    Complete camera/parent inverse, parent-relative center, affine rendered paint
    and controls, native nested targeting/body interaction, non-crossing offsets
    and anchors, local-frame rotation and pointer transaction ownership.
  genuinely_missing: >-
    Signed resize extents, idempotent native scale/flip writes, reflected starting
    axes/visible-handle correspondence on a new gesture, signed anchor placement
    and ordinary release continuation. Positive-size clamps naturally omit the
    new contract. No arbitrary fault, special camera obstacle or handler disable.
references:
  gold.patch: >-
    Signed spans in the snapshot's reflected angle basis. Positive native scale
    magnitudes plus explicit absolute flip state prevent per-event toggles;
    signed anchor-to-center vectors preserve carried points and grab offsets.
    A new gesture captures the then-visible reflected directions. Existing inverse,
    control renderer, body path and release lifecycle are retained.
  alternatives/alternative.patch: >-
    Capture full native material edge vectors and fixed/moving endpoints; remove
    the initial pointer offset and resolve the endpoint vector in the dual basis.
    Construct an absolute parent-local affine matrix and apply/decompose it with
    the native helper, which resets reflection before writing scales. New gestures
    read the resulting full basis, independent of normalization. An isolated zero
    column uses a subpixel limit for QR; no zero-area checkpoint is graded.
partials:
  negative.patch:
    omission: Signed anchor-to-center placement; uses scale magnitudes for placement.
    expected_reached_failure: >-
      Nested B final side preview is 36x36 centered at initial-axis (-12,0), not
      (-48,0). Expanded paint remains on the wrong side, a 93.271px center error.
      These are scalar predictions, not executed observations.
  negative-cases/unreflected-snapshot.patch:
    omission: Reflection-aware starting basis on a subsequent handle gesture.
    expected_reached_failure: >-
      First crossing and release are supported. The regrabbed corner's one-sixth
      preview is 34x25 rather than 38x25; corners are displaced about5.182px while
      the center happens to agree. This is visible size/anchor failure, not parity.
oracle:
  geometry: Explicit public fixed/moving endpoint polygons, independent forward fixture/camera projection.
  observations: >-
    Screenshot-only canvas-bounded palettes, distributed interior, edges, silhouette,
    winding-aware inward normals, fixed layers/camera and visible selection.
    Actual unordered marker blobs and actual fill support ordinary native input.
    No candidate state, arrays, transforms, oCoords, __geom or telemetry is read.
  continuation: >-
    Nested B side crossing, release, geometric-corner reacquisition, independent
    corner dimensions crossing the other axis, release, rigid fill movement.
    One compact Single C non-crossing/rotation/fill segment. No camera matrix expansion.
  observer_preservation: >-
    Canvas-bounded red/blue/white sampling; semantic zoom labels; visible first
    summary and display:contents text with closed-details descendants excluded.
    No fixed rotation-stem length or side. Unsupported acquisition is coverage.
  result_contract: >-
    Preserve raw screenshots, overlays, actions, errors, runtime and coverage records.
    Stop dependent input at divergence/unsupported observation. Cleanup images are
    unscored. Exit0=complete covered pass,1=reached behavior failure,2=causal review
    for setup/runtime/coverage. Raw complete-alternative passed/raw_success is not
    legacy control_passed. No native checker was run by this author.
