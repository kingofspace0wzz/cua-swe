id: v3.slate-softbreak-scroll.002
track: web_frontend
type: interaction_state
difficulty: l3
repo_snapshot:
  source: local
  path: "private-artifact:source-0042"
  ref: slate-5900-adapted-v2-lower
instruction: "In the Field Log Composer, the writer is partway through the active entry with that entry sitting at the bottom of the log. Continuing the same entry on a new line (Shift+Enter, not a new entry) moves the writing spot to somewhere the writer can no longer see it; the composer's status strip reports the writing spot as below the fold while it is off screen. Fix the composer so that continuing the current entry keeps the writing spot in view without throwing away the lines just above it. Do not change the workspace frame payload, the log text, the frame layout, the status indicator behavior, or the plain Enter / typing behavior."
setup:
  install: [npm ci]
  launch: [npm run build && node server.mjs --host 127.0.0.1 --port 4173]
  reset: []
environment:
  adapter: playwright_web
  start_url: http://127.0.0.1:4173
  viewport_or_device: desktop-1280x720
allowed_tools: {code_edit: true, terminal: true, browser_gui: true, mobile_gui: false}
budgets: {wall_time_sec: 1800, max_steps: 80, max_gui_actions: 120, max_test_runs: 20}
verifiers:
  build: [npm run build]
  unit: []
  ui: [python3 verifiers/browser_check.py]
  visual: []
  state: []
  side_effects: []
artifacts: {collect_patch: true, collect_logs: true, collect_screenshots: true, collect_trajectory: true, collect_state_diff: false}
