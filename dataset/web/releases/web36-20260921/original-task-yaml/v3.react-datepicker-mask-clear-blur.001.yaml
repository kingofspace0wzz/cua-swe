id: v3.react-datepicker-mask-clear-blur.001
track: web_frontend
type: functional_ui
difficulty: l3
repo_snapshot: {source: local, path: "private-artifact:source-0040", ref: rdp6180-clean-room-v1}
instruction: >-
  On the appointment booking form, the date field misbehaves when the user
  clears it. After selecting all and deleting the date, the field shows the
  input mask's empty placeholder, but as soon as focus leaves the field it
  snaps back to the previously selected date instead of staying cleared.
  Clearing the appointment date and clicking away must leave the field empty
  and the selected date shown as None. A field that is left with a merely
  invalid but non-empty date must still keep the previously selected date.
  Fix the field so blur behaves correctly. The app runs at the start URL.
setup:
  install: [npm ci]
  launch:
    - npm run build && CUA_SWE_EXTERNAL_SERVICE_ORIGIN=http://127.0.0.1:{service_port} node server.mjs --host 127.0.0.1 --port 4173
  reset: []
environment: {adapter: playwright_web, start_url: 'http://127.0.0.1:4173', viewport_or_device: desktop-1280x720}
allowed_tools: {code_edit: true, terminal: true, browser_gui: true, mobile_gui: false}
budgets: {wall_time_sec: 1800, max_steps: 80, max_gui_actions: 120, max_test_runs: 20}
verifiers:
  build: [npm run build]
  unit: []
  ui: [python3 verifiers/verify.py]
  visual: []
  state: []
  side_effects: []
artifacts: {collect_patch: true, collect_logs: true, collect_screenshots: true, collect_trajectory: true, collect_state_diff: false}
schema_version: 1
