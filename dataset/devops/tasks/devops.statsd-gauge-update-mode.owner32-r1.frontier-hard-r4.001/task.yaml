instruction: After a collector rollout, some gauge readings jump to the size of a
  change while other gauge streams remain stable. Investigate the live datagrams,
  the fleet inventory and the update history, then repair ingestion. Preserve native
  units, every received update, metric identity and producer attribution, healthy
  traffic, idle state, reset, replay and page reload. Follow each fleet endpoint's
  currently demonstrated conventions and the published processing bound; any general
  correct repair is acceptable.
