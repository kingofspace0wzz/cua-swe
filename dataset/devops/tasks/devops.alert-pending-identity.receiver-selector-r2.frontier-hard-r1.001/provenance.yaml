notes:
  - Prometheus alerting semantics establish that a changed labelset is a new alert identity,
    so sample-dependent labels reset the pending clock every evaluation.
  - Alertmanager routing and grouping establish that the receiver consumes a declared label
    selector and dedups notifications by its own route identity.
  - The delivery journal, rotated receiver routes, and protected profiles are original
    adversarial extensions; the console, engine, profiles, and assets are original.
  - No Prometheus or Alertmanager source, configuration, tests, or assets are copied.
