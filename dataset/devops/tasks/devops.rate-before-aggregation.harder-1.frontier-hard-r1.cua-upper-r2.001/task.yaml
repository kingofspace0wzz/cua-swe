  ref: reset-lineage-late-arrival-paired-windows-v1
instruction: Counter Order Console shows narrow rectangular traffic blocks around
  target restarts and inflated window totals in both paired observation windows, while
  ramped load bursts are legitimate. Compare Burst control, Rolling restart, and Restart
  in burst across every panel in both observation windows; inspect event markers, target
  reset and publication evidence, the collection record, and the deployed Query definitions
  inspector. Repair the durable query binding while preserving every window, panel, target,
  point, real burst, marker, total, peak, range, scenario, control, and diagnostic.
