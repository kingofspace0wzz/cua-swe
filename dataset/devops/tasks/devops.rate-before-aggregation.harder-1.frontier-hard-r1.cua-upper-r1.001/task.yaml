id: devops.rate-before-aggregation.harder-1.frontier-hard-r1.cua-upper-r1.001
track: web_frontend
benchmark_domain: devops-observability
type: functional_ui
difficulty: l3
repo_snapshot:
  source: local
  path: dataset/devops/tasks/devops.rate-before-aggregation.harder-1.frontier-hard-r1.cua-upper-r1.001/repo
  ref: paired-window-counter-lineage-consequences-v1
instruction: Counter Order Console shows narrow rectangular traffic blocks around
  target restarts and inflated window totals in both paired observation windows,
  across every counter panel, while ramped load bursts are legitimate. Compare Burst
  control, Rolling restart, and Restart in burst across every panel in both observation
  windows; correlate event markers, target reset evidence, the collection lineage
  record for each window, and the deployed Query definitions inspector before and
  after the recorded publication transition. Repair the durable query binding while
  preserving every window, panel, target, point, real burst, marker, total, peak,
  range, scenario, control, and diagnostic.
setup:
  install: []
  launch:
  - CUA_SWE_EXTERNAL_SERVICE_ORIGIN=http://127.0.0.1 node server.mjs --host 127.0.0.1
    --port 4441
  reset: []
environment:
  adapter: playwright_web
  start_url: http://127.0.0.1:4441
  viewport_or_device: desktop-1280x720
