successor_change: 'One axis (require_producer_provenance_specific_vocabulary_resolution): the same raw
  severity vocabulary is no longer globally authoritative across producer channels. The evaluator-owned
  receiver fleet exposes producer provenance, raw body, epoch, and unaffected controls through normal
  operator screens; the repair must resolve vocabulary per stable producer provenance while preserving
  shared aliases and unknown values. The exact GPT-6 shared-vocabulary repair from the parent applies
  and fails. Hidden profiles rename producer and token values.'
