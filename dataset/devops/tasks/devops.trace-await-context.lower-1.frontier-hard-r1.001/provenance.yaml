notes:
  - This controlled harder successor changes only one axis by adding evaluator-owned runtime compatibility variants; protected profiles now declare manager-specific continuation support, and a store-based hidden variant requires native continuations, so a fixed compile target no longer satisfies every variant. Mechanism, source architecture, instruction style, and ancestry oracle are unchanged.
  - The issue and documentation change establish that native async/await can bypass ZoneContextManager propagation depending on compilation target.
  - The concurrent-operation, multi-instrumentation, and manager-specific continuation-variant topology is an original adversarial extension used to distinguish complete propagation from manual or global-root shortcuts.
  - The Continuum console, context engine, profiles, schedules, verifier, and assets are original implementations; no upstream source, tests, issue text, or assets are copied.
