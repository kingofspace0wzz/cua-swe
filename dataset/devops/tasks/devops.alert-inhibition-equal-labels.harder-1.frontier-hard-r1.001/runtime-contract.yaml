schema_version: 1
visibility: evaluator_owned
service:
  command: node env/service.mjs --host 127.0.0.1 --port {service_port} --profile visible
  working_directory: <candidate_root>
  health_path: /health
  visibility: evaluator_owned
  implementation: repo/verifiers/inhibition_service.mjs
  fixture: repo/verifiers/profiles.json
application:
  command: CUA_SWE_EXTERNAL_SERVICE_ORIGIN=http://127.0.0.1:{service_port} node server.mjs --host 127.0.0.1 --port {app_port}
  working_directory: repo
  health_path: /
  start_url: http://127.0.0.1:{app_port}
ports:
  allocation: free_port_per_run
  declared_defaults: {service: 4372, application: 4371}
grading_runtime:
  started_by: repo/verifiers/browser_check.py
  variants: [visible, hidden]
  oracle: protected-alert-queue-edge-and-arrival-signatures
  note: >-
    Each run starts a fresh inhibition service and application host. The
    service owns the raw alerts, the per-profile scope-dimension registry that
    classifies every equality dimension, the registry notes and incident
    advisories that narrate which classification gates inhibition
    eligibility, the hidden renamed profile, and the expected queue and edge
    signatures. The decisive equality-label contract exists only in this
    evaluator-owned runtime state; the agent-visible source renders the
    registry, notes, and advisories generically and never states which
    dimension classification requires concrete values, nor which dimensions
    tolerate matching by absence.
agent_workspace:
  policy: source_and_instruction_only
  stripped_before_the_agent_sees_the_workspace:
    - repo/verifiers/
    - env/
    - task.yaml
    - gold.patch
    - negative.patch
    - negatives/
    - alternates/
    - replay.md
    - evidence.yaml
    - provenance.yaml
    - candidate.yaml
    - runtime-contract.yaml
    - operator-gate.yaml
    - custody.json
    - design-review.json
agent_policy:
  service_source_visible: false
  direct_loopback_http_allowed: false
  process_environment_inspection_allowed: false
browser_observation:
  steps:
    - compare firing and suppressed queue membership
    - follow suppression edges to their source alerts
    - read the scope-dimension registry roles and operator notes
    - read the incident advisory about alerts opened before the label rollout
    - inspect per-dimension label comparisons, including absent, empty, recorded, and absence-tolerated states
    - inspect the deployed rule presence guards
    - load the arriving-alert incident and recheck scope isolation and legacy suppression
  decisive_paths:
    - incident.label
    - summary.firing-count
    - summary.suppressed-count
    - summary.unscoped-count
    - advisory.text
    - dimension.name
    - dimension.role
    - dimension.note
    - alert.scope-state
    - alert.inhibited-by
    - edge.source
    - edge.target
    - comparison.dimension
    - comparison.role
    - comparison.state
    - rule.required-source-labels
    - rule.required-target-labels
source_noninferability:
  forbidden_agent_source_literals:
    - prometheus/alertmanager
    - issues-507-1727-and-inhibition-docs
    - inhibition_service.mjs
    - profiles.json
    - expectedSignature
    - v-node-west
    - h-source-cobalt
    - BillingQueueStuck
    - SettlementJobsStuck
    - LedgerReplayLag
    - CacheEvictionsStalled
    - tenant
