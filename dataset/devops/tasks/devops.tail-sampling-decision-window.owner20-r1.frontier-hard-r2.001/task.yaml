id: devops.tail-sampling-decision-window.owner20-r1.frontier-hard-r2.001
track: web_frontend
benchmark_domain: devops-observability
type: functional_ui
difficulty: l3
repo_snapshot:
  source: local
  path: dataset/devops/tasks/devops.tail-sampling-decision-window.owner20-r1.frontier-hard-r2.001/repo
  ref: owner20-finite-decision-wait-frontier-hard-r2
instruction: The Tail Sampling Console shows incident traces with failed dependencies
  missing from the trace store. Investigate the live windows and replay, then repair
  the durable collector configuration. Keep all error and slow traces eligible for
  retention while preserving the ordinary sampling baseline and the receiver service
  levels shown in the console. Collector settings and decision timing may change;
  received spans, their timestamps, trace details, filters, and replay inputs must
  remain intact.
