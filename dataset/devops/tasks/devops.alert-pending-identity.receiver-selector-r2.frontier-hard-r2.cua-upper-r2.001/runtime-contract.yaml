schema_version: 1
visibility: evaluator_owned
service:
  command: node env/service.mjs --host 127.0.0.1 --port {service_port} --profile visible
  working_directory: <candidate_root>
  health_path: /health
  visibility: evaluator_owned
  implementation: repo/verifiers/service.mjs
  fixture: repo/verifiers/profiles.json
  runbook_document: repo/verifiers/runbook.png
application:
  command: CUA_SWE_EXTERNAL_SERVICE_ORIGIN=http://127.0.0.1:{service_port} node server.mjs
    --host 127.0.0.1 --port {app_port}
  working_directory: repo
  health_path: /
  start_url: http://127.0.0.1:{app_port}
ports:
  allocation: free_port_per_run
  declared_defaults:
    application: 55100
    service: OS-assigned
grading_runtime:
  started_by: repo/verifiers/browser_check.py
  variants:
  - visible
  - hidden
  - hidden-order
  oracle: Independent Python state machine from protected telemetry, original rule intent,
    and the evaluator-owned per-scope routing policy classes with the runbook custody
    dispositions; no submitted plan or page text
source_noninferability:
  policy_class_custody_mapping_absent_from:
  - repository source, comments, and example shapes
  - instruction and README
  - catalog, snapshot, and audit JSON payloads (catalog carries only opaque class codes per scope)
  - HTML, DOM text, and accessibility metadata (the runbook is a raster image with a generic alt text)
  - build output, logs, process arguments, and environment variables
  only_channel: evaluator-owned raster runbook sheet served as image/png through /api/runbook
agent_workspace:
  policy: source_and_instruction_only
  stripped_before_the_agent_sees_the_workspace:
  - repo/verifiers/
  - env/
  - task.yaml
  - gold.patch
  - negative.patch
  - negatives/
  - alternates/
  - replay.md
  - evidence.yaml
  - provenance.yaml
  - candidate.yaml
  - runtime-contract.yaml
  - operator-gate.yaml
  - custody.json
  - design-review.json
agent_policy:
  service_source_visible: false
  direct_loopback_http_allowed: false
  process_environment_inspection_allowed: false
browser_observation:
  steps:
  - compare persistent query series and pending timeline with churning fingerprints
  - open Labels & detail and compare consecutive evaluated identities
  - watch the routing epoch pairs and their bracketed policy classes across Next evaluation,
    Replay capture, and Reset
  - open the Routing runbook tab and read the custody disposition of each policy class
    from the posted operations sheet
  - check the receiver match selector, delivery counts, recovery, and independent targets
  maximum_primary_actions: 2
