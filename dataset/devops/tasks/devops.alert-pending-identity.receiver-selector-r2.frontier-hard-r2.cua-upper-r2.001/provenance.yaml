notes:
- Prometheus alerting semantics establish that a changed labelset is a new alert identity, so evaluation-scoped
  labels reset the pending clock every time they rotate.
- Alertmanager routing establishes that the receiver consumes a declared label selector, so routed and
  stable enrichment labels must remain part of the alert identity.
- The routing epochs, their opaque per-scope policy classes, the raster routing policy runbook, rotation
  cadences, and the rotated protected profiles are original adversarial extensions; the console, engine,
  profiles, runbook sheet, and assets are original.
- No Prometheus or Alertmanager source, configuration, tests, or assets are copied.
- This immutable successor moves the complete routing-epoch-to-receiver-identity authority from source-visible
  rule-family ownership in the machine-readable catalog to an evaluator-owned operator routing policy
  runbook rendered only in pixels and available before configuration. The exact successful GPT-6 catalog-ownership
  repair and both GPT-6 snapshot-before-configure repairs from the parent confirmation apply and fail;
  hidden profiles rename epoch scopes, keys, cadences, and enrichments and require all four policy-class
  mappings.
