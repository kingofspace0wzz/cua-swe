successor_basis: Upper-frontier CUA-hardening round on the immutable certified lower anchor. The only
  changed difficulty axis is require_epoch_and_window_authority_intersection; the protected event
  fixtures, regional-parity oracle, rollup repair topology, instruction style, budgets, and
  reset/unaffected controls are preserved from the parent. The durable rollup definition becomes a
  window-scoped deployment schedule with four dated revisions, the runtime gains a deployment ledger
  and three per-window comparison views, and the authoritative deployment epoch differs per
  aggregation window, so the correct repair is identifiable only by intersecting the definition,
  rollup, reset, and unaffected comparison-view evidence across both windows. Both successful parent
  lower-anchor CUA patches are retained byte-exactly as protected negatives and now repair only the
  superseded legacy default.
