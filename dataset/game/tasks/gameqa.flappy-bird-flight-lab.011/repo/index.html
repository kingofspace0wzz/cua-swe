<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flappy Bird Flight Lab</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <canvas id="game" width="640" height="480" aria-label="Flappy Bird Flight Lab"></canvas>
      <p>Choose a drill, then compare its input receipt, actual and target impulse, thick actual trace, faint target, and any contact interval. Each result freezes until you return. Space, ↑, click, or tap control the normal run.</p>
    </main>
    <script src="src/input.js"></script>
    <script src="src/bird.js"></script>
    <script src="src/pipes.js"></script>
    <script src="src/renderer.js"></script>

    <script src="src/game_api.js"></script>
  </body>
</html>
