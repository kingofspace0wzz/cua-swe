difficulty: l4
repo_snapshot:
  source: local
  path: dataset/collections/game-cua/tasks/game/gameqa.minesweeper-delayed-loss-episode-identity.003/repo
  ref: gameworld-games-55322928-minesweeper-delayed-loss-episode-identity-retargeted-timing-mutant
  link_node_modules: false
  copy_mode: exact
instruction: >-
  The deterministic Minesweeper benchmark has an episode-boundary regression
  in its intentionally delayed loss presentation. After exposing a mine with
  either a normal click or a count-valid chord, quickly starting a fresh board
  through the face or Game API can leave the new board dead or later flip it
  back to the prior loss. Before editing, let one direct loss remain pending
  until the live Episode integrity panel classifies its Timing check, then use
  the panel to validate both Timing and Ownership. Preserve first-click safety,
  seeded layouts, chord/flag/question behavior, counters, adjacency rendering,
  and both reset routes. Do not remove the delayed presentation or reload the
  page. This successor uses a newly protected handoff calibration; do not
  assume the predecessor's timing value.
