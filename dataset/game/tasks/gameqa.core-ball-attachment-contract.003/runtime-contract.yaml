schema_version: 1
visibility: evaluator_owned
service:
  command: node env/service.mjs --host 127.0.0.1 --port {service_port}
  working_directory: <candidate_root>
  health_path: /health
  visibility: evaluator_owned
  implementation: env/service.mjs
application:
  command: >-
    CUA_SWE_EXTERNAL_SERVICE_ORIGIN=http://127.0.0.1:{service_port}
    node server.mjs --host 127.0.0.1 --port {app_port}
  working_directory: repo
  health_path: /
  start_url: http://127.0.0.1:{app_port}/?scenario=contract
ports:
  allocation: free_port_per_run
  declared_defaults:
    service: evaluator_allocated
    application: 51200
grading_runtime:
  started_by: repo/verifiers/browser_check.py
  note: >-
    The verifier owns fixed-step gameplay advancement and protected assertions.
    The evaluator-owned health service establishes the protected runtime
    boundary required by the clean-ablation harness; the application does not
    consume benchmark values from that service.
agent_workspace:
  policy: source_and_instruction_only
  stripped_before_the_agent_sees_the_workspace:
    - repo/verifiers/
    - env/
    - task.yaml
    - gold.patch
    - negative.patch
    - replay.md
    - interaction-gate.yaml
    - runtime-contract.yaml
agent_policy:
  service_source_visible: false
  direct_loopback_http_allowed: false
  process_environment_inspection_allowed: false
browser_observation:
  mode: screenshot_only
  steps:
    - start the deterministic round
    - launch once, then use an ordinary second coordinate call while the long opening flight remains visible
    - confirm the visible queue cue changes to NEXT PIN READY
    - observe the first contact and pace change
    - observe the follow-up immediately before and after contact
    - finish with spaced taps and restart
  decisive_paths:
    - round.phase
    - shots.active.progress
    - shots.active.flightTime
    - shots.active.launchProfile
    - shots.waiting
    - motion.transition.active
    - occupancy.pins
    - lastAttachment.at
    - lastAttachment.coreAngle
    - lastAttachment.localAngle
    - lastAttachment.launchProfile
    - metrics.attachments
    - metrics.failures
    - metrics.completed
source_noninferability:
  forbidden_agent_source_literals:
    - "58.275"
    - "69.147"
    - "59.58675"
    - "30.41325"
    - "22.25925"
    - "170.28"
    - "20710"
    - "118.8"
    - "248.4"
    - "post_commit_promotion_transaction"
