  ref: 425630714879067138dd3e64d88f0bead7415407
instruction: >-
  The deterministic Level 3 benchmark build contains a gameplay regression.
  Play through the center crossing and use the live cargo scanner to determine
  why collecting the descending-lift cargo makes inventory disagree with the
  world. Fix the underlying implementation and replay both the collection and
  normal level completion.
setup:
