id: gameqa.captain-callisto-collision-offset.005
track: web_frontend
benchmark_domain: game-interactive-app-qa
type: gameplay_regression
difficulty: l4
repo_snapshot:
  source: local
  path: dataset/collections/game-cua/tasks/game/gameqa.captain-callisto-collision-offset.005/repo
  ref: captain-callisto-released-jetpack-corner-v3
instruction: >-
  The deterministic Level 4 build contains a gameplay regression. When the
  astronaut descends onto the exposed northeast deck corner after using the
  jetpack, the character can visibly clip into the edge and become trapped
  despite continued movement input. Reproduce the problem, fix the underlying
  implementation, and replay the route through the narrow deck opening to
  level completion.
setup:
  install:
    - npm ci
    - npm run build
  reset: []
  launch:
    - npm run dev -- --host 127.0.0.1 --port 44319
environment:
  adapter: playwright_web
  start_url: http://127.0.0.1:44319/?benchmark=1&level=4
  viewport_or_device: desktop-1280x720
  observation_mode: visual
allowed_tools:
  code_edit: true
  terminal: true
  browser_gui: true
  mobile_gui: false
budgets:
  wall_time_sec: 1800
  max_steps: 180
  max_gui_actions: 160
  max_test_runs: 20
verifiers:
  build:
    - npm run build
  unit: []
  ui: []
  visual: []
  state:
    - >-
      "${CUA_SWE_PYTHON:-python3}" verifiers/replay_state.py
      --url "${CUA_SWE_WEB_URL:-http://127.0.0.1:44319/?benchmark=1&level=4}"
  side_effects: []
artifacts:
  collect_patch: true
  collect_logs: true
  collect_screenshots: true
  collect_trajectory: true
  collect_state_diff: true
game_runtime:
  provider: gameworld
  game_id: 06_captaincallisto
  state_api: window.gameAPI
  seed: 45
  level: 4
schema_version: 1
