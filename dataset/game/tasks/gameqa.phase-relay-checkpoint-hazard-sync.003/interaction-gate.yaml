    - verifier-artifacts/04-returned-held.png
    - verifier-artifacts/05-departure.png
    - verifier-artifacts/06-first-pulse.png
    - verifier-artifacts/07-second-pulse.png
    - verifier-artifacts/08-replayed-opening.png
    - verifier-artifacts/09-complete.png
    - verifier-artifacts/10-restarted.png
  state_record: verifier-artifacts/state-replay.json
  construction_outcomes:
    no_op: fail
    gold: pass
    negative: fail
