<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signal Weave</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">THREE-LANE TRANSIT</p>
          <h1>Signal Weave</h1>
        </div>
        <div class="controls">Move: WASD / Arrows · Restart: R</div>
      </header>
      <canvas id="game" width="1000" height="620" aria-label="Signal Weave game"></canvas>
      <footer>
        <span>Collect both prisms.</span>
        <span>Follow the pulsing OPEN lane.</span>
        <span>Reach the right portal.</span>
      </footer>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
