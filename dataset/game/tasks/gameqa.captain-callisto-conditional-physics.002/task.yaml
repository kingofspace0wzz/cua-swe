id: gameqa.captain-callisto-conditional-physics.002
track: web_frontend
benchmark_domain: game-interactive-app-qa
type: gameplay_regression
difficulty: l4
repo_snapshot:
  source: local
  path: dataset/collections/game-cua/tasks/game/gameqa.captain-callisto-conditional-physics.002/repo
  ref: captain-callisto-level3-release-transfer-v3
instruction: >-
  The deterministic Level 3 two-lift route is reproduced by holding D+Shift
  from the starting platform, then releasing only Shift while continuing to
  hold D across both lifts. The astronaut visibly reverses horizontal
  direction after release even though right remains held. Fix the complete
  moving-support handoff and replay the entire route to the flag. A valid
  repair must remain stable across both lifts and finish normally; disappearance
  of the initial left bend alone is not sufficient.
setup:
  install:
    - npm ci
    - npm run build
  reset: []
  launch:
    - npm run dev -- --host 127.0.0.1 --port 4173
environment:
  adapter: playwright_web
  start_url: http://127.0.0.1:4173/?benchmark=1&level=3
  viewport_or_device: desktop-1280x720
  observation_mode: visual
allowed_tools:
  code_edit: true
  terminal: true
  browser_gui: true
  mobile_gui: false
budgets:
  wall_time_sec: 1800
  max_steps: 240
  max_gui_actions: 200
  max_test_runs: 20
verifiers:
  build:
    - npm run build
  unit: []
  ui: []
  visual: []
  state:
    - '"${CUA_SWE_PYTHON:-python3}" verifiers/replay_state.py --url "${CUA_SWE_WEB_URL:-http://127.0.0.1:4173/?benchmark=1&level=3}"'
  side_effects: []
artifacts:
  collect_patch: true
  collect_logs: true
  collect_screenshots: true
  collect_trajectory: true
  collect_state_diff: true
game_runtime:
  provider: gameworld
  game_id: 06_captaincallisto
  state_api: window.gameAPI
  seed: 44
  level: 3
schema_version: 1
